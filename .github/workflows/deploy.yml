name: Deploy to AWS
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Copy app.py to EC2 (The Shipping Stage)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app.py"
          target: "/home/ubuntu/"

      - name: Restart App on EC2 (The Execution Stage)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Clean up the server and start the app
            sudo apt-get update -y
            sudo apt-get install -y python3-flask
            sudo fuser -k 80/tcp || true
            sudo python3 /home/ubuntu/app.py &
